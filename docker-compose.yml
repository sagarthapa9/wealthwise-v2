services:
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:8000:8000"   # only Caddy (on host) needs this — never expose publicly
    environment:
      - DATABASE_URL=postgresql+asyncpg://wealthwise:${POSTGRES_PASSWORD}@db:5432/wealthwise
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - DEEPSEEK_BASE_URL=${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-chat}
      - EODHD_API_KEY=${EODHD_API_KEY:-}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - wealthwise-network

  db:
    image: pgvector/pgvector:pg17   # pgvector-enabled, needed for RAG embeddings
    ports:
      - "127.0.0.1:5432:5432"       # localhost only — for your own psql debugging from the VPS
    environment:
      POSTGRES_USER: wealthwise
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: wealthwise
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wealthwise"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - wealthwise-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "127.0.0.1:5173:5173"   # dev-only; prod frontend is served by Vercel, not this container
    environment:
      - CHOKIDAR_USEPOLLING=1
      - WATCHPACK_POLLING=true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/index.html:/app/index.html
    depends_on:
      - api
    restart: unless-stopped
    networks:
      - wealthwise-network

networks:
  wealthwise-network:
    driver: bridge

volumes:
  pgdata:
